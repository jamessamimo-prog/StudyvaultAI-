function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
}
function saveDB(db) {
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}
function defaultDB() {
  return {
    users: [],
    orders: [],
    books: SEED_BOOKS,
    releases: {}, // userId -> { bookId: { released: true, releasedAt } }
    studySessions: [],
    settings: {}
  };
}
function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

async function geminiGenerate(prompt, system) {
  try {
    const res = await fetch('/api/gemini', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt,
        system: system || 'You are StudyVault AI Tutor. Be accurate, structured, and encouraging. Answer the student directly with clear detail.',
        model: APP_CONFIG.GEMINI_MODEL
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const msg = data.error || ('API error ' + res.status);
      if (res.status === 404) {
        return '**AI is not connected yet**\n\nThe /api/gemini route was not found on this deployment.\n\n1. Make sure your GitHub repo has the folder **api** with file **gemini.js**\n2. Import the repo on Vercel (not static-only upload)\n3. Add env variable **GEMINI_API_KEY**\n4. Redeploy';
      }
      return '**AI error**\n\n' + msg;
    }
    if (!data.text) return smartFallback(prompt);
    return data.text;
  } catch (err) {
    return '**AI request failed**\n\n' + (err.message || String(err)) + '\n\nCheck that GEMINI_API_KEY is set in Vercel and the project was redeployed.';
  }
}

function smartFallback(prompt) {
  const p = prompt.toLowerCase();
  if (p.includes('summar')) {
    return '**Summary**\n\n1. Identify the main claim or topic.\n2. List 3–5 supporting points from the material.\n3. Note key terms and definitions.\n4. End with one sentence on why it matters for exams.\n\nTip: Write the summary in your own words — that is the best test of understanding.';
  }
  if (p.includes('quiz') || p.includes('question')) {
    return '**Practice Question**\n\nWhat is the most effective way to study a new chapter?\n\nA) Read once quickly\nB) Explain the ideas out loud in your own words\nC) Highlight every sentence\nD) Skip to the end\n\n**Answer:** B — Teaching or explaining forces deeper processing than passive reading.';
  }
  if (p.includes('explain') || p.includes('tutor')) {
    return '**AI Tutor Explanation**\n\nStart with the core definition in one sentence. Then add one concrete example from daily life. Finally, connect the idea to what you already know.\n\nIf a step is unclear, isolate that step and rephrase it more simply. Mastery comes from repeated, active explanation — not from rereading alone.';
  }
  return '**StudyVault AI**\n\nI can help you summarize chapters, generate practice questions, and explain difficult ideas. Open a purchased book in your library, or paste a topic and ask for an explanation, summary, or quiz.\n\n(For live Gemini answers across all users, the platform owner can set GEMINI_API_KEY in the app configuration.)';
}

/* ===== UI PRIMITIVES ===== */
function Logo({ size = 'md' }) {

  return (
    <div className={`${s} logo-mark rounded-xl flex items-center justify-center text-white font-extrabold shadow-lg shadow-blue-900/30 relative overflow-hidden`}>
      <span className="relative z-10">SV</span>
      <div className="absolute inset-0 opacity-30" style={{ background: 'repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(255,255,255,.15) 4px, rgba(255,255,255,.15) 8px)' }} />
    </div>
  );
}

function Btn({ children, onClick, variant = 'primary', className = '', disabled, type = 'button', size = 'md' }) {
  const base = 'inline-flex items-center justify-center gap-2 font-semibold rounded-xl transition focus:outline-none focus:ring-2 focus:ring-brand-500/40 disabled:opacity-50 disabled:cursor-not-allowed';
  const sizes = { sm: 'px-3 py-1.5 text-xs', md: 'px-4 py-2.5 text-sm', lg: 'px-6 py-3 text-base' };
  const variants = {
    primary: 'bg-brand-600 text-white hover:bg-brand-700 shadow-md shadow-brand-600/20',
    secondary: 'bg-brand-900 text-white hover:bg-brand-950',
    outline: 'border-2 border-brand-200 text-brand-800 bg-white hover:bg-brand-50',
    ghost: 'text-slate-600 hover:bg-slate-100',
    danger: 'bg-red-600 text-white hover:bg-red-700',
    soft: 'bg-brand-50 text-brand-700 hover:bg-brand-100'
  };
  return (
    <button type={type} disabled={disabled} onClick={onClick} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>{children}</button>
  );
}

function Card({ children, className = '' }) {

}

    amber: 'bg-amber-50 text-amber-800',

/* ===== MAIN APP ===== */
function App() {
  const [db, setDb] = useState(() => loadDB() || defaultDB());
  const [session, setSession] = useState(() => {
    try { return JSON.parse(localStorage.getItem(DB_KEY + '_session')) || null; } catch { return null; }
  });
  const [page, setPage] = useState('home');
  const [toast, setToast] = useState(null);
  const [loading, setLoading] = useState(false);
  const [selectedBook, setSelectedBook] = useState(null);
  const [readerBook, setReaderBook] = useState(null);
  const [cart, setCart] = useState([]);
  const [search, setSearch] = useState('');
  const [catFilter, setCatFilter] = useState('All');
  const [aiInput, setAiInput] = useState('');
  const [aiOut, setAiOut] = useState('');
  const [authForm, setAuthForm] = useState({ name: '', email: '', password: '' });
  const [adminTab, setAdminTab] = useState('overview');
  const [releaseForm, setReleaseForm] = useState({ userId: '', bookId: '', note: '' });
  const [newBook, setNewBook] = useState({ title: '', author: '', category: 'General', price: '', description: '', content: '', cover: '📘' });

  useEffect(() => { saveDB(db); }, [db]);
  useEffect(() => {
    if (session) localStorage.setItem(DB_KEY + '_session', JSON.stringify(session));
    else localStorage.removeItem(DB_KEY + '_session');
  }, [session]);

  const notify = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

  const isAdmin = session?.role === 'admin';
  const user = session?.role === 'user' ? db.users.find(u => u.id === session.userId) : null;

  const categories = useMemo(() => ['All', ...new Set(db.books.map(b => b.category))], [db.books]);
  const filteredBooks = db.books.filter(b => {
    const q = search.toLowerCase();
    const matchQ = !q || b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q) || b.description.toLowerCase().includes(q);
    const matchC = catFilter === 'All' || b.category === catFilter;
    return matchQ && matchC;
  });

  const userOrders = user ? db.orders.filter(o => o.userId === user.id && o.status === 'paid') : [];
  const ownedBookIds = new Set(userOrders.flatMap(o => o.items.map(i => i.bookId)));
  const releasedForUser = user ? (db.releases[user.id] || {}) : {};

  function go(p) { setPage(p); window.scrollTo(0, 0); }

  /* Auth */
  function handleSignup(e) {
    e.preventDefault();
    if (db.users.some(u => u.email.toLowerCase() === authForm.email.toLowerCase())) {
      notify('Email already registered'); return;
    }
    if (authForm.email.toLowerCase() === APP_CONFIG.ADMIN_EMAIL.toLowerCase()) {
      notify('This email is reserved'); return;
    }
    const u = {
      id: uid(), name: authForm.name, email: authForm.email.toLowerCase(),
      password: authForm.password, createdAt: new Date().toISOString(),
      lastLogin: new Date().toISOString()
    };
    setDb(d => ({ ...d, users: [...d.users, u] }));
    setSession({ role: 'user', userId: u.id });
    notify('Account created');
    go('dashboard');
  }

  function handleLogin(e) {
    e.preventDefault();
    const email = authForm.email.trim().toLowerCase();
    const pass = authForm.password;
    if (email === APP_CONFIG.ADMIN_EMAIL.toLowerCase() && pass === APP_CONFIG.ADMIN_PASS) {
      setSession({ role: 'admin' });
      notify('Admin signed in');
      go('admin');
      return;
    }
    const u = db.users.find(x => x.email === email && x.password === pass);
    if (!u) { notify('Invalid email or password'); return; }
    setDb(d => ({
      ...d,
      users: d.users.map(x => x.id === u.id ? { ...x, lastLogin: new Date().toISOString() } : x)
    }));
    setSession({ role: 'user', userId: u.id });
    notify('Welcome back');
    go('dashboard');
  }

  function logout() {
    setSession(null);
    setCart([]);
    go('home');
    notify('Signed out');
  }

  /* Cart & purchase */
  function addToCart(book) {
    if (!session || isAdmin) { notify('Please sign in as a student to purchase'); go('login'); return; }
    if (ownedBookIds.has(book.id)) { notify('You already own this book'); return; }
    if (cart.some(c => c.id === book.id)) { notify('Already in cart'); return; }
    setCart(c => [...c, book]);
    notify('Added to cart');
  }

  function checkout() {
    if (!user || cart.length === 0) return;
    const order = {
      id: uid(),
      userId: user.id,
      userEmail: user.email,
      userName: user.name,
      items: cart.map(b => ({ bookId: b.id, title: b.title, price: b.price })),
      total: cart.reduce((s, b) => s + b.price, 0),
      status: 'paid',
      createdAt: new Date().toISOString(),
      paymentMethod: 'Card (simulated)'
    };
    setDb(d => ({ ...d, orders: [order, ...d.orders] }));
    // Auto-release content for purchased books (in-app reading)
    setDb(d => {
      const rel = { ...(d.releases[user.id] || {}) };
      cart.forEach(b => { rel[b.id] = { released: true, releasedAt: new Date().toISOString(), by: 'auto' }; });
      return { ...d, releases: { ...d.releases, [user.id]: rel } };
    });
    setCart([]);
    notify('Purchase successful! Books unlocked in My Library');
    go('library');
  }

  /* Admin release PDF/content */
  function adminRelease() {
    if (!releaseForm.userId || !releaseForm.bookId) { notify('Select user and book'); return; }
    setDb(d => {
      const rel = { ...(d.releases[releaseForm.userId] || {}) };
      rel[releaseForm.bookId] = {
        released: true,
        releasedAt: new Date().toISOString(),
        by: 'admin',
        note: releaseForm.note
      };
      return { ...d, releases: { ...d.releases, [releaseForm.userId]: rel } };
    });
    notify('Content released to user');
    setReleaseForm({ userId: '', bookId: '', note: '' });
  }

  function adminAddBook(e) {
    e.preventDefault();
    const book = {
      id: uid(),
      title: newBook.title,
      author: newBook.author,
      category: newBook.category || 'General',
      price: parseFloat(newBook.price) || 0,
      cover: newBook.cover || '📘',
      description: newBook.description,
      pages: Math.max(10, Math.floor((newBook.content || '').length / 500)),
      rating: 5,
      content: newBook.content || '# ' + newBook.title + '\n\nContent pending.'
    };
    setDb(d => ({ ...d, books: [book, ...d.books] }));
    setNewBook({ title: '', author: '', category: 'General', price: '', description: '', content: '', cover: '📘' });
    notify('Book published');
  }

  function openReader(book) {
    if (!user) return;
    const released = releasedForUser[book.id]?.released;
    if (!ownedBookIds.has(book.id) || !released) {
      notify('This book is not released for reading yet');
      return;
    }
    setReaderBook(book);
    go('reader');
  }

  async function runAI(mode) {
    setLoading(true);
    setAiOut('');
    try {
      let prompt = aiInput;
      if (mode === 'summary' && readerBook) prompt = `Summarize this book content for a student:\n\n${readerBook.content.slice(0, 6000)}`;
      if (mode === 'quiz' && readerBook) prompt = `Create 5 short quiz questions with answers from:\n\n${readerBook.content.slice(0, 6000)}`;
      if (mode === 'explain') prompt = `Explain clearly for a student:\n${aiInput || readerBook?.title || 'study skills'}`;
      const text = await geminiGenerate(prompt, 'You are StudyVault AI, an expert tutor.');
      setAiOut(text);
    } catch (err) {
      setAiOut('Error: ' + err.message);
    } finally {
      setLoading(false);
    }
  }

  /* ===== LAYOUTS ===== */
  const Nav = () => (
    <header className="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200">
      <div className="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
        <button onClick={() => go(session ? (isAdmin ? 'admin' : 'dashboard') : 'home')} className="flex items-center gap-2 font-bold text-brand-900">
          <Logo size="sm" />
          <span className="hidden sm:inline">{APP_CONFIG.APP_NAME}</span>
        </button>
        <nav className="flex items-center gap-1 overflow-x-auto text-sm">
          {!session && (
            <>
              <button onClick={() => go('store')} className="px-3 py-1.5 rounded-lg hover:bg-brand-50 text-slate-700">Bookstore</button>
              <button onClick={() => go('about')} className="px-3 py-1.5 rounded-lg hover:bg-brand-50 text-slate-700">About</button>
              <Btn size="sm" variant="ghost" onClick={() => go('login')}>Log in</Btn>
              <Btn size="sm" onClick={() => go('signup')}>Sign up</Btn>
            </>
          )}
          {session && !isAdmin && (
            <>
              <button onClick={() => go('dashboard')} className={`px-3 py-1.5 rounded-lg ${page==='dashboard'?'bg-brand-50 text-brand-700 font-semibold':'text-slate-600'}`}>Home</button>
              <button onClick={() => go('store')} className={`px-3 py-1.5 rounded-lg ${page==='store'?'bg-brand-50 text-brand-700 font-semibold':'text-slate-600'}`}>Store</button>
              <button onClick={() => go('library')} className={`px-3 py-1.5 rounded-lg ${page==='library'?'bg-brand-50 text-brand-700 font-semibold':'text-slate-600'}`}>Library</button>
              <button onClick={() => go('tutor')} className={`px-3 py-1.5 rounded-lg ${page==='tutor'?'bg-brand-50 text-brand-700 font-semibold':'text-slate-600'}`}>AI Tutor</button>
              <button onClick={() => go('cart')} className="px-3 py-1.5 rounded-lg text-slate-600 relative">
                Cart{cart.length > 0 && <span className="ml-1 bg-brand-600 text-white text-[10px] px-1.5 rounded-full">{cart.length}</span>}
              </button>
              <Btn size="sm" variant="ghost" onClick={logout}>Logout</Btn>
            </>
          )}

              <div>
                <label className="text-sm font-medium">Book</label>
                <select className="mt-1 w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" value={releaseForm.bookId} onChange={e => setReleaseForm(f => ({ ...f, bookId: e.target.value }))}>
                  <option value="">Select book…</option>
                  {db.books.map(b => <option key={b.id} value={b.id}>{b.title}</option>)}
                </select>
              </div>
              <Input label="Internal note (optional)" value={releaseForm.note} onChange={e => setReleaseForm(f => ({ ...f, note: e.target.value }))} />
              <Btn onClick={adminRelease}>Release to user</Btn>
            </div>
            <div className="mt-8">
              <h3 className="font-semibold text-sm mb-2">Current releases</h3>
              {Object.keys(db.releases).length === 0 && <p className="text-sm text-slate-500">None yet</p>}
              {Object.entries(db.releases).map(([uid, books]) => {
                const u = db.users.find(x => x.id === uid);
                return (
                  <div key={uid} className="text-sm py-2 border-t border-slate-100">
                    <div className="font-medium">{u?.name || uid}</div>
                    {Object.entries(books).map(([bid, info]) => {
                      const b = db.books.find(x => x.id === bid);
                      return <div key={bid} className="text-slate-500 pl-2">→ {b?.title || bid} {info.released ? '✓' : ''} {info.by === 'admin' ? '(admin)' : '(auto)'}</div>;
                    })}
                  </div>
                );
              })}
            </div>
          </Card>
        )}
      </div>
    );
  };

  const About = () => (
    <div className="max-w-3xl mx-auto px-4 py-12 fade prose prose-slate">
      <h1 className="text-3xl font-extrabold text-brand-950 mb-4">About StudyVault</h1>
      <p className="text-slate-600 leading-relaxed mb-4">
        StudyVault is a digital learning and bookstore platform built for students and educators. Browse academic titles, purchase securely, and read exclusively inside the application after access is released to your account.
      </p>
      <p className="text-slate-600 leading-relaxed mb-4">
        The product combines commerce, access control, an in-app reader, and an AI study assistant so learning resources stay organized in one place.
      </p>
      <h2 className="text-xl font-bold mt-8 mb-2">For administrators</h2>
      <p className="text-slate-600">The admin console provides live visibility into signups, orders, revenue, catalog publishing, and per-user content release — supporting operational control over digital distribution.</p>
    </div>
  );

  return (
    <div className="min-h-screen flex flex-col">
      {Nav()}
      <div className="flex-1">
        {page === 'home' && Home()}
        {page === 'login' && AuthPage({ mode: 'login' })}
        {page === 'signup' && AuthPage({ mode: 'signup' })}
        {page === 'store' && Store()}
        {page === 'book' && BookDetail()}
        {page === 'cart' && CartPage()}
        {page === 'library' && Library()}
        {page === 'reader' && Reader()}
        {page === 'dashboard' && Dashboard()}
        {page === 'tutor' && Tutor()}
        {page === 'admin' && isAdmin && Admin()}
        {page === 'about' && About()}
        {page === 'admin' && !isAdmin && <div className="p-10 text-center">Access denied</div>}
      </div>
      {toast && (
        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-brand-950 text-white px-5 py-3 rounded-xl text-sm shadow-xl fade max-w-[90vw]">{toast}</div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
